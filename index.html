<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meraksandık — Araştırma & Kavram Kataloğu</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#11100e">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meraksandık">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=50">
</head>
<body>
  <div class="library-backdrop" aria-hidden="true"></div>
  <div class="lamp-spotlight-beam" aria-hidden="true"></div>
  <div class="background-glows" aria-hidden="true">
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>
  </div>

  <!-- Gerçek Çekilebilir, Sallanabilir & Temayı Değiştiren Nostaljik Lamba Zinciri -->
  <div class="lamp-pull-chain-wrap" id="lampPullChain" role="button" tabindex="0" title="Masa Lambası Zinciri — çekerek veya sallayarak temayı değiştir! 💡" aria-label="Masa Lambası Zinciri (Aydınlık / Karanlık Tema)">
    <div class="chain-fixture"></div>
    <svg id="chainPhysicsSvg" class="chain-physics-svg" viewBox="0 0 100 240">
      <defs>
        <radialGradient id="brassBeadGrad" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#fff0cc"/>
          <stop offset="35%" stop-color="#e8b868"/>
          <stop offset="85%" stop-color="#a66e22"/>
          <stop offset="100%" stop-color="#613b0a"/>
        </radialGradient>
        <radialGradient id="handleGrad" cx="30%" cy="25%" r="75%">
          <stop offset="0%" stop-color="#ffeac2"/>
          <stop offset="40%" stop-color="#dba24d"/>
          <stop offset="85%" stop-color="#945d19"/>
          <stop offset="100%" stop-color="#543105"/>
        </radialGradient>
      </defs>
      <!-- Geniş Görünmez Dokunma Hattı (Mobilde parmakla anında tutabilmek için 52px genişlik) -->
      <path id="chainTouchArea" d="" stroke="transparent" stroke-width="52" fill="none" stroke-linecap="round" class="chain-touch-target"/>
      <!-- Dinamik Zincir Bağlantı Teli -->
      <path id="chainCordPath" d="" stroke="#a66e22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- Boncuklar (JS tarafından konumlandırılır) -->
      <g id="chainBeadsGroup"></g>
      <!-- Pirinç Damla Tutamaç (Geniş 60px dokunma alanıyla) -->
      <g id="chainHandleGroup" class="chain-handle">
        <circle cx="0" cy="18" r="30" fill="transparent" stroke="transparent" class="handle-touch-target"/>
        <path d="M 0 0 C -6 0, -8 9, -6 20 C -4 30, 0 37, 0 37 C 0 37, 4 30, 6 20 C 8 9, 6 0, 0 0 Z" fill="url(#handleGrad)" stroke="#613b0a" stroke-width="1.3"/>
        <ellipse cx="-1.8" cy="16" rx="2.8" ry="5.5" fill="#fff7e6" opacity="0.7"/>
      </g>
    </svg>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="plate" title="Meraksandık">
        <div class="plate-icon">
          <svg viewBox="0 0 24 24" class="brand-logo-svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10C3 7 6 5 12 5C18 5 21 7 21 10"/>
            <rect x="3" y="10" width="18" height="9" rx="2"/>
            <circle cx="12" cy="14.5" r="1.2" fill="currentColor"/>
            <path d="M12 16v1.5"/>
          </svg>
        </div>
        <span class="plate-title">MERAKSANDIK</span>
      </div>

      <div class="topbar-actions">
        <button id="ambientSoundBtn" class="icon-button ambient-btn" type="button" title="Arka Plan Ambiyansı (Yağmur / Şömine)" aria-label="Ambiyans Sesi">
          <span id="ambientIcon">🔇</span>
        </button>
        <button id="profileBtn" class="icon-button" type="button" title="Katalog & Geçmiş" aria-label="Katalog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 4v16M14 14h3"/></svg>
        </button>
        <button id="settingsBtn" class="icon-button" type="button" title="Ayarlar" aria-label="Ayarlar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v2M12 20v2M22 12h-2M4 12H2M19.07 4.93l-1.41 1.41M6.34 17.66l-1.41 1.41M19.07 19.07l-1.41-1.41M6.34 6.34L4.93 4.93"/></svg>
        </button>
      </div>
    </header>

    <main id="stage" class="stage"></main>
  </div>

  <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay is-hidden">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title-group">
          <h2>Ayarlar</h2>
          <span class="modal-subtitle">Kütüphane tercihleri</span>
        </div>
        <button id="closeSettings" class="icon-button close-btn" type="button" aria-label="Kapat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="settings-card">
          <!-- Renk Paleti Seçici (tema değişimi lamba ipinden yapılıyor) -->
          <div class="toggle-field palette-toggle-row">
            <div class="toggle-info">
              <span class="toggle-title">Renk Paleti</span>
            </div>
            <div class="palette-grid" role="group" aria-label="Renk Paleti Seçimi">
              <button type="button" class="palette-btn is-active" data-palette="coffee">
                <span class="palette-dot dot-coffee"></span>
                <span>☕ Sıcak Kahve</span>
              </button>
              <button type="button" class="palette-btn" data-palette="library">
                <span class="palette-dot dot-library"></span>
                <span>🌲 Gece Kütüphanesi</span>
              </button>
              <button type="button" class="palette-btn" data-palette="matcha">
                <span class="palette-dot dot-matcha"></span>
                <span>🍵 Matcha & Yulaf</span>
              </button>
            </div>
          </div>

          <label class="range-field">
            <div class="range-header">
              <span>Araştırma süresi</span>
              <strong id="researchLabel" class="pill-badge">15 dk</strong>
            </div>
            <input id="researchRange" type="range" min="1" max="45" step="1" value="15">
            <div class="range-ticks">
              <span>5 dk</span>
              <span>15 dk</span>
              <span>30 dk</span>
              <span>45 dk</span>
            </div>
          </label>

          <label class="toggle-field">
            <div class="toggle-info">
              <span class="toggle-title">Masa saati ve sesler</span>
              <span class="toggle-desc">Çekmece tıkırtısı ve süre bitiş zili</span>
            </div>
            <input id="soundToggle" type="checkbox" checked>
          </label>

          <label class="range-field">
            <div class="range-header">
              <span>Ses seviyesi</span>
              <strong id="soundVolumeLabel" class="pill-badge">%70</strong>
            </div>
            <input id="soundVolumeRange" type="range" min="0" max="100" step="5" value="70">
            <div class="range-ticks">
              <span>Kısık</span>
              <span>Orta</span>
              <span>Yüksek</span>
            </div>
          </label>
        </div>

      </div>
    </div>
  </div>

  <!-- Profile & Catalog Modal -->
  <div id="profileModal" class="modal-overlay is-hidden">
    <div class="modal modal-wide">
      <div class="modal-head">
        <div class="modal-title-group">
          <h2>Katalog Fişlerin</h2>
          <span class="modal-subtitle">Araştırıp arşivine eklediğin kavramlar</span>
        </div>
        <button id="closeProfile" class="icon-button close-btn" type="button" aria-label="Kapat">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div id="statsContainer"></div>

        <div class="history-controls">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="historySearchInput" type="text" placeholder="Katalogda fiş ara...">
          </div>
          <div id="historyFilterRow" class="history-filter-pills"></div>
        </div>

        <div id="historyListContainer"></div>

        <div class="profile-actions">
          <button id="exportHistoryBtn" class="btn btn-secondary btn-sm" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Kataloğu Dışa Aktar (.md)
          </button>
          <button id="clearHistoryBtn" class="link-btn link-danger" type="button">Kataloğu Boşalt</button>
        </div>
      </div>
    </div>
  </div>

  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
  <script src="app.js?v=50"></script>
</body>
</html>
